<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Texterna i boken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ee; --card: #ffffff; --text: #1f1d1a; --muted: #6b665e; --line: #e4ded4;
  --p0: #1f6f8b; --p0-bg: #e6f2f6; --p1: #a2475e; --p1-bg: #f8e9ed; --p2: #4f7a3a; --p2-bg: #ebf3e5;
  --prose: #8a6a2f; --prose-bg: #f5ecd9; --accent: #b5832a;
  --font-ui: Figtree, system-ui, sans-serif; --font-ar: "Noto Naskh Arabic", "Arial", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171614; --card: #22201d; --text: #ece8e1; --muted: #a39d93; --line: #36322d;
    --p0: #7cc3dc; --p0-bg: #1c2e35; --p1: #e59bb0; --p1-bg: #3a2229; --p2: #a5d18b; --p2-bg: #24301d;
    --prose: #e0b25c; --prose-bg: #352b19; --accent: #e0b25c;
  }
}
:root[data-theme="dark"] {
  --bg: #171614; --card: #22201d; --text: #ece8e1; --muted: #a39d93; --line: #36322d;
  --p0: #7cc3dc; --p0-bg: #1c2e35; --p1: #e59bb0; --p1-bg: #3a2229; --p2: #a5d18b; --p2-bg: #24301d;
  --prose: #e0b25c; --prose-bg: #352b19; --accent: #e0b25c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); line-height: 1.5; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 80px; }
a { color: var(--accent); }
.back { font-size: .9rem; text-decoration: none; }
header h1 { margin: 0; font-size: 1.9rem; font-weight: 800; }
header .ar-title { font-family: var(--font-ar); font-size: 2.6rem; line-height: 1.6; margin: 8px 0 0; direction: rtl; }
header p { color: var(--muted); margin: 6px 0 0; }
.audio { display: flex; flex-wrap: wrap; gap: 12px 20px; margin-top: 14px; }
.audio label { font-size: .85rem; color: var(--muted); display: block; }
.audio audio { height: 36px; max-width: 100%; }
.controls {
  position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; margin: 20px 0 8px;
  border-bottom: 1px solid var(--line); display: flex; flex-wrap: nowrap; gap: 6px; align-items: center;
  overflow-x: auto;
}
.controls span { color: var(--muted); font-size: .8rem; margin-right: 2px; flex: none; }
.toggle {
  font: inherit; font-size: .8rem; font-weight: 600; border: 1px solid var(--line); background: var(--card);
  color: var(--text); padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; flex: none;
}
.toggle[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.turn {
  background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--who);
  border-radius: 14px; padding: 16px 20px; margin: 14px 0;
}
.turn.p0 { --who: var(--p0); --who-bg: var(--p0-bg); }
.turn.p1 { --who: var(--p1); --who-bg: var(--p1-bg); }
.turn.p2 { --who: var(--p2); --who-bg: var(--p2-bg); }
.turn.prose { --who: var(--prose); --who-bg: var(--prose-bg); }
.who {
  display: inline-block; font-size: .8rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  color: var(--who); background: var(--who-bg); padding: 2px 10px; border-radius: 999px;
}
.who .num { opacity: .6; margin-right: 4px; }
.line + .line { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.ar-row { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.ar { font-family: var(--font-ar); font-size: 1.9rem; line-height: 2; direction: rtl; text-align: right; margin: 6px 0 2px; }
.play {
  flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--card); color: var(--who); cursor: pointer; font-size: .9rem;
}
.play.alt { font-size: .75rem; font-weight: 800; color: var(--muted); }
.line.playing .ar { color: var(--who); }
.tr { color: var(--accent); font-style: italic; font-size: 1.02rem; }
.lit { color: var(--muted); font-size: .95rem; }
.lit::before { content: "ord för ord: "; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
.sv { font-weight: 600; font-size: 1.12rem; margin-top: 4px; }
/* Från början syns bara huvudraden. Knapparna under Visa slår på resten. */
.tr, .lit, .sv { display: none; }
.show-tr .tr, .show-lit .lit, .show-sv .sv { display: block; }
section.extra { margin-top: 48px; }
section.extra h2 { font-size: 1.35rem; font-weight: 800; margin: 0 0 12px; }
.tips { display: grid; gap: 12px; }
.tip { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
.tip h3 { margin: 0 0 4px; font-size: 1rem; }
.tip .ar-inline { font-family: var(--font-ar); font-size: 1.35rem; direction: rtl; unicode-bidi: isolate; }
.tip p { margin: 4px 0 0; color: var(--muted); }
details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin: 12px 0; }
summary { font-weight: 800; cursor: pointer; }
.full-ar { font-family: var(--font-ar); font-size: 1.45rem; line-height: 2.1; direction: rtl; text-align: right; }
.full-ar p, .full-sv p { margin: 6px 0; }
.full-sv b { font-size: .9rem; }
.full-ar b { font-size: 1.2rem; }
.key { color: var(--muted); font-size: .92rem; }
.key code { font-family: inherit; font-weight: 700; color: var(--text); }
footer {
  margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: .95rem; font-weight: 600;
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center;
}
footer a { text-decoration: none; }
footer .alla {
  color: var(--text); border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px;
}
footer .next { text-align: right; }
.back {
  display: inline-block; color: var(--text); font-weight: 600; border: 1px solid var(--line);
  background: var(--card); border-radius: 999px; padding: 4px 12px;
}
@media (max-width: 520px) {
  footer { grid-template-columns: 1fr 1fr; }
  footer .alla { grid-column: 1 / -1; grid-row: 1; justify-self: center; }
}
.list { display: grid; gap: 12px; margin-top: 24px; }
.list h2 { font-size: 1.1rem; margin: 18px 0 0; color: var(--muted); font-weight: 800; }
.item {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none; color: var(--text);
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 20px;
}
.item:hover { border-color: var(--accent); }
.item .sv-t { font-weight: 700; font-size: 1.1rem; }
.item .meta { color: var(--muted); font-size: .85rem; }
.item .ar-t { font-family: var(--font-ar); font-size: 1.7rem; direction: rtl; white-space: nowrap; flex: none; }
@media (max-width: 520px) {
  .ar { font-size: 1.6rem; }
  header .ar-title { font-size: 2.2rem; }
  .turn { padding: 14px; }
}

.toprow { display: flex; justify-content: space-between; gap: 12px; }
button.back { font: inherit; font-size: .9rem; cursor: pointer; }
.login { max-width: 380px; margin: 40px auto 0; display: grid; gap: 14px; }
.login h1 { margin: 0; font-size: 1.9rem; font-weight: 800; }
.login .ar-title { font-family: var(--font-ar); font-size: 2.4rem; line-height: 1.5; margin: 0; direction: rtl; text-align: right; }
.login .muted { color: var(--muted); margin: 0; }
.login label { display: grid; gap: 6px; font-weight: 600; font-size: .9rem; }
.login input {
  font: inherit; font-size: 1rem; padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--text);
}
.login button {
  font: inherit; font-weight: 700; padding: 11px; border-radius: 10px; border: 0;
  background: var(--text); color: var(--bg); cursor: pointer;
}
.login button:disabled { opacity: .6; cursor: wait; }
.login .fel { color: #c0392b; margin: 0; min-height: 1.2em; font-weight: 600; }
.lat-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.lat { font-size: 1.3rem; font-weight: 600; line-height: 1.5; margin: 6px 0 4px; }
.line.playing .lat { color: var(--who); }
.arx { display: none; }
.show-ar .arx { display: block; }
p.arx { font-family: var(--font-ar); font-size: 1.55rem; line-height: 1.9; direction: rtl; text-align: right; color: var(--muted); margin: 0 0 2px; }
.dialval { display: grid; gap: 14px; margin-top: 28px; }
.dialval a {
  display: block; text-decoration: none; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 14px; padding: 18px 20px;
}
.dialval a:hover { border-color: var(--accent); }
.dialval b { display: block; font-size: 1.3rem; }
.dialval span { color: var(--muted); font-size: .9rem; }
.full-lat { font-size: 1.08rem; line-height: 1.8; }
.full-lat p { margin: 6px 0; }
.list h2.dial { font-size: 1.5rem; color: var(--text); margin: 32px 0 0; }
.list h2.dial:first-child { margin-top: 8px; }
.list h2.dial small { font-size: .85rem; color: var(--muted); font-weight: 600; margin-left: 8px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const SALT = "Pq2bJ0r7v6m1yQ3sXk8dZg==";
const UTTALSNYCKEL = "<code>ʾ</code> hamza (kort stopp i halsen) · <code>ʿ</code> ʿayn · <code>ḥ</code> ح · <code>kh</code> خ ·\n<code>dh</code> ذ · <code>th</code> ث · <code>gh</code> غ · <code>sh</code> ش · <code>ṣ ḍ ṭ ẓ</code> de \"tunga\" ص ض ط ظ ·\n<code>ā ī ū</code> långa vokaler · dubbel konsonant = shadda. Det inom parentes är formella ändelser som man\noftast hoppar över i tal.";
// Bokens texter. Innehållet (texter.bin och ljud/*.bin) är krypterat och låses upp med
// användarnamn och lösenord. Nyckeln sparas i webbläsaren så att man bara loggar in en gång.
// SALT sätts av bygg_texter.py.
const ITER = 600000;
const NYCKEL_KEY = "texter-nyckel";
const VISA_KEY = "texter-visa";  // det man har slagit på under Visa (från början inget)
const app = document.getElementById("app");
let KEY = null, TEXTER = null;
const ljudCache = {};
let player = null, vakt = null, aktiv = null;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function html(tag, cls, h) { const e = el(tag, cls); e.innerHTML = h; return e; }
function store(fn) { try { return fn(); } catch (e) { return null; } }

// --- Kryptering ---
async function nyckelFran(anv, losen) {
  const bas = await crypto.subtle.importKey("raw", new TextEncoder().encode(anv.trim().toLowerCase() + "\n" + losen),
    "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
    bas, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function dekryptera(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("Kunde inte hämta " + url);
  const buf = new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, KEY, buf.slice(12));
}
async function laddaTexter() {
  TEXTER = JSON.parse(new TextDecoder().decode(await dekryptera("texter.bin")));
}
function ljudUrl(fil) {
  if (!ljudCache[fil]) {
    ljudCache[fil] = dekryptera(fil).then(b => URL.createObjectURL(new Blob([b], { type: "audio/mpeg" })));
  }
  return ljudCache[fil];
}

// --- Inloggning ---
function visaInloggning(fel) {
  document.title = "Texterna i boken";
  app.innerHTML = "";
  app.append(html("a", "back", "← Ordkorten"));
  app.lastChild.href = "../standardarabiska/";
  const box = el("form", "login");
  box.innerHTML = `
    <p class="ar-title" lang="ar">النصوص</p>
    <h1>Texterna i boken</h1>
    <p class="muted">Logga in för att läsa och lyssna på texterna.</p>
    <label>Användarnamn<input name="anv" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Lösenord<input name="losen" type="password" autocomplete="current-password" required></label>
    <p class="fel" role="alert">${fel || ""}</p>
    <button type="submit">Logga in</button>`;
  box.addEventListener("submit", async e => {
    e.preventDefault();
    const knapp = box.querySelector("button");
    knapp.disabled = true;
    knapp.textContent = "Loggar in …";
    try {
      KEY = await nyckelFran(box.anv.value, box.losen.value);
      await laddaTexter();
      const raw = await crypto.subtle.exportKey("raw", KEY);
      store(() => localStorage.setItem(NYCKEL_KEY, tob64(raw)));
      visa();
    } catch (err) {
      KEY = null;
      visaInloggning("Fel användarnamn eller lösenord.");
    }
  });
  app.append(box);
  box.anv.focus();
}
function loggaUt() {
  store(() => localStorage.removeItem(NYCKEL_KEY));
  KEY = null; TEXTER = null;
  history.replaceState(null, "", location.pathname);
  visaInloggning();
}

// --- Visning ---
const leb = d => d.dialekt === "leb";
const namn = d => `${leb(d) ? "leb_" : ""}kapitel${d.kapitel}_text${d.text}`;
// [kod, namn, beskrivning, ordkortens sida]
const DIALEKTER = [
  ["msa", "Standardarabiska", "Texterna i lektion 2–6", "../standardarabiska/"],
  ["leb", "Libanesiska", "Dialogerna i Spoken Lebanese, kapitel 1, 10 och 11", "../libanesiska/"],
];
const dial = d => d.dialekt || "msa";
const LEB_NYCKEL = `Bokens transkription: <code>9</code> ʿayn · <code>'</code> hamza (kort stopp i halsen, ofta där
standardarabiskan har q) · <code>H</code> ح · <code>x</code> خ · <code>G</code> غ · <code>ʃ</code> sh ·
<code>S D T Z</code> de "tunga" ص ض ط ظ · dubbel vokal = lång vokal · dubbel konsonant = shadda ·
<code>*</code> före ett namn. Den arabiska skriften är tillagd och finns inte i boken.`;

// Adresser: #  = välj dialekt, #msa / #leb = dialektens lista, #kapitel2_text1 / #leb_kapitel10_text1 = en text.
function visa() {
  stopp();
  const id = location.hash.slice(1);
  const i = TEXTER.findIndex(d => namn(d) === id);
  if (i >= 0) visaText(i);
  else if (DIALEKTER.some(x => x[0] === id)) visaLista(id);
  else visaStart();
  window.scrollTo(0, 0);
}

function toprad(tillbakaText, tillbakaHref) {
  const top = el("div", "toprow");
  const back = el("a", "back", tillbakaText);
  back.href = tillbakaHref;
  const ut = el("button", "back", "Logga ut");
  ut.addEventListener("click", loggaUt);
  top.append(back, ut);
  app.append(top);
}

function visaStart() {
  document.title = "Texterna i boken";
  app.innerHTML = "";
  toprad("← Ordkorten", "../");
  app.append(html("header", null,
    '<p class="ar-title" lang="ar">النصوص</p><h1>Texterna i boken</h1>' +
    "<p>Texter och dialoger med uttal, ord för ord, svenska och bokens inspelningar.</p>"));
  const val = el("div", "dialval");
  for (const [kod, rubrik, under] of DIALEKTER) {
    const n = TEXTER.filter(d => dial(d) === kod).length;
    if (!n) continue;
    const a = el("a");
    a.href = "#" + kod;
    a.append(el("b", null, rubrik), el("span", null, `${under} · ${n} ${kod === "leb" ? "dialoger" : "texter"}`));
    val.append(a);
  }
  app.append(val);
}

function visaLista(kod) {
  const [, rubrik, under, ordkort] = DIALEKTER.find(x => x[0] === kod);
  document.title = rubrik + " – texter";
  app.innerHTML = "";
  toprad("← Ordkorten", ordkort);
  app.append(html("header", null, `<h1>${rubrik}</h1><p>${under}</p>`));
  const andra = DIALEKTER.find(x => x[0] !== kod);
  const byt = el("a", "back", `${andra[1]} →`);
  byt.href = "#" + andra[0];
  byt.style.marginTop = "14px";
  app.append(byt);
  const list = el("div", "list");
  let kap = null;
  for (const d of TEXTER.filter(d => dial(d) === kod)) {
    if (d.kapitel !== kap) { kap = d.kapitel; list.append(el("h2", null, "Kapitel " + kap)); }
    list.append(listRad(d));
  }
  app.append(list);
}

function listRad(d) {
  const a = el("a", "item");
  a.href = "#" + namn(d);
  const v = el("div");
  v.append(el("div", "sv-t", d.titel_sv),
    el("div", "meta", `${leb(d) ? "Dialog" : "Text"} ${d.text}${d.ljud ? " · 🔊 ljud" : ""} · ${d.intro}`));
  a.append(v);
  if (!leb(d)) {  // libanesiska har ingen arabisk titel i boken
    const ar = el("div", "ar-t", d.titel_ar);
    ar.lang = "ar";
    a.append(ar);
  }
  return a;
}

function stopp() {
  if (player) player.pause();
  clearInterval(vakt);
  if (aktiv) aktiv.classList.remove("playing");
  aktiv = null;
}
async function spelaBit(fil, s, e, line) {
  stopp();
  aktiv = line;
  line.classList.add("playing");
  const url = await ljudUrl(fil);
  if (aktiv !== line) return;
  if (!player || player.dataset.fil !== fil) {
    player = new Audio(url);
    player.dataset.fil = fil;
  }
  const start = () => {
    player.currentTime = s;
    player.play().catch(() => {});
    vakt = setInterval(() => { if (player.currentTime >= e || player.ended) stopp(); }, 30);
  };
  if (player.readyState >= 1) start(); else player.addEventListener("loadedmetadata", start, { once: true });
}

// Knapparna under Visa: allt är av från början. En påslagen knapp sätter sin klass (show-…) på body.
function visaKnappar(controls) {
  let pa = store(() => JSON.parse(localStorage.getItem(VISA_KEY))) || [];
  controls.querySelectorAll(".toggle").forEach(btn => {
    const cls = btn.dataset.cls;
    const apply = () => {
      document.body.classList.toggle(cls, pa.includes(cls));
      btn.setAttribute("aria-pressed", String(pa.includes(cls)));
    };
    apply();
    btn.addEventListener("click", () => {
      pa = pa.includes(cls) ? pa.filter(c => c !== cls) : [...pa, cls];
      store(() => localStorage.setItem(VISA_KEY, JSON.stringify(pa)));
      apply();
    });
  });
}

function visaText(i) {
  const d = TEXTER[i];
  const samma = TEXTER.filter(x => dial(x) === dial(d));  // föregående/nästa inom samma dialekt
  const j0 = samma.indexOf(d), prev = samma[j0 - 1], nxt = samma[j0 + 1];
  const P = d.personer || [];
  const bok = d.ljud && d.ljud.bok;
  document.title = `${d.titel_sv} – kapitel ${d.kapitel}`;
  app.innerHTML = "";
  const back = el("a", "back", "☰ Alla texter");
  back.href = "#" + dial(d);
  app.append(back);

  const head = el("header");
  const latin = d.skrift === "latin";  // bokens text är en latinsk transkription (libanesiska)
  const art = el("p", "ar-title" + (latin ? " arx" : ""), d.titel_ar);
  art.lang = "ar";
  head.append(art, el("h1", null, d.titel_sv), el("p", null,
    `${leb(d) ? "Libanesiska · " : ""}Kapitel ${d.kapitel}, ${leb(d) ? "dialog" : "text"} ${d.text} · ${d.intro}`));
  if (bok) {
    const box = el("div", "audio");
    const wrap = el("div");
    const au = el("audio");
    au.controls = true;
    au.preload = "none";
    wrap.append(el("label", null, "Bokens inspelning"), au);
    box.append(wrap);
    head.append(box);
    const om = d.ljud.omrade;
    ljudUrl(bok).then(u => { au.src = om ? `${u}#t=${om[0]},${om[1]}` : u; }).catch(() => {});
    au.addEventListener("play", () => { if (player && player !== au) stopp(); });
  }
  app.append(head);

  const controls = html("div", "controls", '<span>Visa:</span>' +
    (latin ? '<button class="toggle" data-cls="show-ar">Arabiska</button>'
           : '<button class="toggle" data-cls="show-tr">Uttal</button>') +
    '<button class="toggle" data-cls="show-lit">Ord för ord</button><button class="toggle" data-cls="show-sv">Svenska</button>');
  controls.setAttribute("role", "group");
  app.append(controls);
  visaKnappar(controls);

  const dialog = el("div");
  const fullAr = el("div", latin ? "full-lat" : "full-ar"), fullSv = el("div", "full-sv");
  if (!latin) fullAr.lang = "ar";
  const farg = v => "p" + (P[v].f != null ? P[v].f : v % 3);
  d.delar.forEach((del, k) => {
    const prose = del.vem == null;
    const card = el("article", "turn " + (prose ? "prose" : farg(del.vem)));
    const tag = el("span", "who");
    tag.append(el("span", "num", String(k + 1)), prose ? "Stycke" : P[del.vem].sv);
    card.append(tag);
    del.rader.forEach(([ar, tr, lit, sv], j) => {
      const line = el("div", "line");
      // Standardarabiska: arabiskan stor och uttalet under. Libanesiska: bokens text stor,
      // och arabisk skrift under som bara visas när "Arabiska" är påslaget.
      const row = el("div", latin ? "lat-row" : "ar-row");
      const huvud = latin ? el("p", "lat", tr) : el("p", "ar", ar);
      if (!latin) huvud.lang = "ar";
      row.append(huvud);
      const tid = del.tider && del.tider[j];
      if (bok && tid) {
        const b = el("button", "play", "▶");
        b.title = "Lyssna";
        b.addEventListener("click", () => spelaBit(bok, tid[0], tid[1], line));
        row.append(b);
      }
      line.append(row);
      if (latin) { const a = el("p", "arx", ar); a.lang = "ar"; line.append(a); }
      else line.append(el("div", "tr", tr));
      if (lit) line.append(el("div", "lit", lit));
      line.append(el("div", "sv", sv));
      card.append(line);
    });
    dialog.append(card);
    const pa = el("p");
    if (!prose) pa.append(el("b", null, (latin ? P[del.vem].bok || P[del.vem].sv : P[del.vem].ar) + ": "));
    pa.append(del.bok);
    fullAr.append(pa);
    const ps = el("p");
    if (!prose) ps.append(el("b", null, P[del.vem].sv + ": "));
    ps.append(del.rader.map(r => r[3]).join(" "));
    fullSv.append(ps);
  });
  app.append(dialog);

  if (d.tips && d.tips.length) {
    const sec = el("section", "extra");
    sec.append(el("h2", null, "Bra att veta"));
    const tips = el("div", "tips");
    for (const t of d.tips) {
      const tip = el("div", "tip");
      tip.append(el("h3", null, t.h));
      if (t.ar) { const a = el("span", "ar-inline", t.ar); a.lang = "ar"; tip.append(a); }
      tip.append(html("p", null, t.p));
      tips.append(tip);
    }
    sec.append(tips);
    app.append(sec);
  }

  const hela = el("section", "extra");
  hela.append(el("h2", null, "Hela texten"));
  for (const [rubrik, inner] of [["Som i boken", fullAr], ["Bara svenska", fullSv], ["Uttalsnyckel", html("p", "key", leb(d) ? LEB_NYCKEL : UTTALSNYCKEL)]]) {
    const det = el("details");
    det.append(el("summary", null, rubrik), inner);
    hela.append(det);
  }
  app.append(hela);

  const fot = el("footer");
  const l = prev ? el("a", "prev", "← " + prev.titel_sv) : el("span", "prev");
  if (prev) l.href = "#" + namn(prev);
  const m = el("a", "alla", "☰ Alla texter");
  m.href = "#" + dial(d);
  const r = nxt ? el("a", "next", nxt.titel_sv + " →") : el("span", "next");
  if (nxt) r.href = "#" + namn(nxt);
  fot.append(l, m, r);
  app.append(fot);
}

window.addEventListener("hashchange", () => { if (TEXTER) visa(); });

// Start: försök med sparad nyckel, annars inloggning.
(async () => {
  const sparad = store(() => localStorage.getItem(NYCKEL_KEY));
  if (sparad) {
    try {
      KEY = await crypto.subtle.importKey("raw", b64(sparad), { name: "AES-GCM" }, true, ["decrypt"]);
      await laddaTexter();
      return visa();
    } catch (e) {
      store(() => localStorage.removeItem(NYCKEL_KEY));
      KEY = null;
    }
  }
  visaInloggning();
})();

</script>
</body>
