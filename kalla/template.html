<title>Arabiska ordkort</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; card-type picker on top, flip card in the middle, navigation buttons below. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --fg: #17202B;
  --muted: #5B6676;
  --line: #D6DCE4;
  --noun: #1F5FD1;  --noun-soft: #E3ECFB;
  --verb: #D9650B;  --verb-soft: #FCEBDD;
  --prep: #B02A78;  --prep-soft: #F8E3EF;
  --adj: #2E7D3E;   --adj-soft: #E1F2E5;
  --pron: #6A4BC4;  --pron-soft: #ECE6FA;
  --q: #946A00;     --q-soft: #F8EDCC;
  --other: #5E6B7D; --other-soft: #E8ECF1;
  --good: #1E8A4C;
  --bad: #B83A3A;
  --scrim: rgba(14, 19, 26, .45);
  --font-display: "Figtree", system-ui, -apple-system, sans-serif;
  --font-ui: "Figtree", system-ui, -apple-system, sans-serif;
  --font-ar: "Noto Naskh Arabic", "Geeza Pro", "Arial", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131A; --surface: #18202B; --fg: #E9EDF2; --muted: #98A3B3; --line: #2A3442;
    --noun: #6FA2FF; --noun-soft: #1B2A44; --verb: #FF9F4D; --verb-soft: #3A2716;
    --prep: #F27BBE; --prep-soft: #3B1C2F; --other: #A9B4C4; --other-soft: #252F3C;
    --adj: #62C87A; --adj-soft: #17321F; --pron: #A994F2; --pron-soft: #261E42; --q: #E8BC45; --q-soft: #3A2F10;
    --good: #4CC27D; --bad: #F07A7A; --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131A; --surface: #18202B; --fg: #E9EDF2; --muted: #98A3B3; --line: #2A3442;
  --noun: #6FA2FF; --noun-soft: #1B2A44; --verb: #FF9F4D; --verb-soft: #3A2716;
  --prep: #F27BBE; --prep-soft: #3B1C2F; --other: #A9B4C4; --other-soft: #252F3C;
  --adj: #62C87A; --adj-soft: #17321F; --pron: #A994F2; --pron-soft: #261E42; --q: #E8BC45; --q-soft: #3A2F10;
  --good: #4CC27D; --bad: #F07A7A; --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 420px; margin: 0 auto; padding-block: 18px 28px; display: flex; flex-direction: column; gap: 14px; }

header { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top .count { flex: none; white-space: nowrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.05rem, 5vw, 1.6rem); min-width: 0; margin: 0; letter-spacing: -0.01em; }
h1 span { font-family: var(--font-ar); font-weight: 700; color: var(--muted); font-size: 1.15rem; margin-inline-start: 6px; }
.score, .count { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); white-space: nowrap; }
.count { font-size: 0.95rem; }
h1 a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
h1 .tflags { display: inline-flex; gap: 3px; }
h1 .tflags svg { display: block; width: 30px; height: 20px; border-radius: 3px; box-shadow: 0 0 0 1px var(--line); }
h1 .tflags.many svg { width: 18px; height: 12px; border-radius: 2px; }
@media (max-width: 360px) { h1 a { gap: 7px; } h1 .tflags svg { width: 24px; height: 16px; } h1 .tflags.many svg { width: 15px; height: 10px; } .top .count { font-size: 0.85rem; } }
.pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 12px; font-size: 0.85rem; padding-top: 4px; }
.pages a { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; }
.pages a[aria-current] { color: var(--fg); font-weight: 700; }
.pages svg { display: block; width: 21px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); }
.pages .many { display: inline-flex; gap: 2px; }
.pages .many svg { width: 15px; height: 10px; }
.score b { color: var(--good); }

.typerow { display: flex; gap: 8px; }
.typerow { align-items: center; }
.typerow button { flex: 1; }
select, input[type="text"] {
  font: 600 0.95rem var(--font-ui); padding: 10px 12px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
}
.ghost {
  font: 600 0.9rem var(--font-ui); padding: 10px 14px; border-radius: 12px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); white-space: nowrap;
}

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button {
  flex: 1 0 auto; font: 600 0.82rem var(--font-ui); padding: 7px 10px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
/* Samma färg som ordklassen har på korten. */
.filters button[data-f="noun"] { --k: var(--noun); }
.filters button[data-f="verb"] { --k: var(--verb); }
.filters button[data-f="adj"] { --k: var(--adj); }
.filters button[data-f="prep"] { --k: var(--prep); }
.filters button[data-f="pron"] { --k: var(--pron); }
.filters button[data-f="q"] { --k: var(--q); }
.filters button[data-f="other"] { --k: var(--other); }
.filters button:not([data-f="all"])::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; background: var(--k); }
.filters button[data-f="noun"][aria-pressed="true"] { color: var(--noun); border-color: var(--noun); background: var(--noun-soft); }
.filters button[data-f="verb"][aria-pressed="true"] { color: var(--verb); border-color: var(--verb); background: var(--verb-soft); }
.filters button[data-f="prep"][aria-pressed="true"] { color: var(--prep); border-color: var(--prep); background: var(--prep-soft); }
.filters button[data-f="other"][aria-pressed="true"] { color: var(--other); border-color: var(--other); background: var(--other-soft); }
.filters button[data-f="adj"][aria-pressed="true"] { color: var(--adj); border-color: var(--adj); background: var(--adj-soft); }
.filters button[data-f="pron"][aria-pressed="true"] { color: var(--pron); border-color: var(--pron); background: var(--pron-soft); }
.filters button[data-f="q"][aria-pressed="true"] { color: var(--q); border-color: var(--q); background: var(--q-soft); }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
/* Sök och Filter på en rad. Ordklass, kapitel och tema ligger i en panel som Filter öppnar. */
.searchrow { display: flex; gap: 8px; }
.searchrow .search { flex: 1; }
#filter-btn, #front-btn { display: flex; align-items: center; gap: 6px; }
#filter-btn svg, #front-btn svg { width: 17px; height: 17px; flex: none; }
#filter-btn[aria-expanded="true"] { border-color: var(--fg); }
/* På mobilen visar knapparna bara ikonen, så att sökrutan får plats. */
@media (max-width: 520px) { .searchrow .lbl { display: none; } #filter-btn, #front-btn { padding-inline: 14px; } }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--fg); color: var(--surface); font-size: 0.75rem; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.filterpanel { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); }
.filterpanel .picks { width: 100%; }
.search { width: 100%; min-width: 0; font: 500 0.9rem var(--font-ui); padding: 9px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.search:focus { outline: none; border-color: var(--fg); }
.theme-pick { width: 100%; min-width: 0; font-weight: 500; font-size: 0.9rem; padding: 9px 12px; }
/* Kapitel: en meny där flera kapitel kan väljas. Ser ut som rullistan bredvid. */
.multi { position: relative; min-width: 0; }
.multi-btn { height: 100%; display: flex; align-items: center; gap: 6px; font-family: var(--font-ui); text-align: start; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.multi-btn span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.multi-btn::after { content: ""; flex: none; width: 7px; height: 7px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg); margin-inline: 2px 4px; }
.multi-list { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: 100%; max-height: 60vh; overflow: auto; padding: 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); box-shadow: 0 8px 24px rgba(0, 0, 0, .15); }
.multi-list label { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 0.9rem; white-space: nowrap; cursor: pointer; }
/* Temamenyn står till höger och öppnas åt vänster, så att den inte hamnar utanför skärmen. */
.multi + .multi .multi-list { left: auto; right: 0; }
.multi-list label:hover { background: var(--bg); }
.multi-list input { width: 18px; height: 18px; margin: 0; accent-color: var(--fg); }
.multi-list .clear { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--muted); font: 600 0.85rem var(--font-ui); text-align: start; cursor: pointer; }

.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .3s; }
.sample { font-size: 0.8rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; line-height: 1.45; }

/* Card */
.scene { perspective: 1400px; }
.card {
  --c: var(--noun); --soft: var(--noun-soft);
  display: grid; position: relative; cursor: pointer; transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.3,.7,.3,1); border: 0; padding: 0; background: none;
  width: 100%; text-align: inherit; color: inherit; font: inherit;
}
.card.verb { --c: var(--verb); --soft: var(--verb-soft); }
.card.prep { --c: var(--prep); --soft: var(--prep-soft); }
.card.other { --c: var(--other); --soft: var(--other-soft); }
.card.adj { --c: var(--adj); --soft: var(--adj-soft); }
.card.pron { --c: var(--pron); --soft: var(--pron-soft); }
.card.q { --c: var(--q); --soft: var(--q-soft); }
.card.flipped { transform: rotateY(180deg); }
.card:focus-visible { outline: none; }
.card:focus-visible .face { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--fg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 5px solid var(--c); border-radius: 22px;
  min-height: 420px; padding: 18px; display: flex; flex-direction: column;
}
.back { transform: rotateY(180deg); gap: 12px; }
.chips { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pos { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c); }
.side { font-size: 0.82rem; color: var(--muted); }
.front .sv { flex: 1; display: grid; place-items: center; text-align: center; gap: 8px; align-content: center; }
.front .sv strong { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 10vw, 2.8rem); line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; }
.front .sv small { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
.front .arf { flex: 1; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center; }
.arf .fr { display: flex; align-items: center; justify-content: center; gap: 12px; }
.arf .ar { font-family: var(--font-ar); font-weight: 700; direction: rtl; font-size: clamp(2.2rem, 11vw, 3rem); line-height: 1.35; overflow-wrap: anywhere; }
.arf .ar.small { font-size: clamp(1.6rem, 8vw, 2.1rem); }
.arf small { color: var(--muted); font-size: 0.9rem; }
.pvfront { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.pvfront .ar { font-family: var(--font-ar); font-weight: 700; direction: rtl; font-size: 1.6rem; line-height: 1.4; }
.hint { text-align: center; color: var(--muted); font-size: 0.8rem; }
.word { font-weight: 800; font-size: 1.15rem; overflow-wrap: anywhere; }

.dialect { display: flex; flex-direction: column; }
.dlabel { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.dlabel em { font-style: normal; font-weight: 500; letter-spacing: 0; text-transform: none; }
.frow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.frow:last-child { border-bottom: 0; }
.frow .l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.frow .k { font-weight: 700; font-size: 0.85rem; }
.frow .tr { font-style: italic; color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.ayn { font-style: normal; font-weight: 500; font-size: 0.8em; line-height: 0; vertical-align: 0.4em; display: inline-block; margin: 0 0.06em; }
.ayn.hz { transform: scaleX(-1); }
.say {
  flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface);
  color: var(--c); display: grid; place-items: center; cursor: pointer; padding: 0;
}
.say svg { width: 18px; height: 18px; }
.say.playing { background: var(--soft); border-color: var(--c); }
.frow .r { display: flex; align-items: center; gap: 10px; min-width: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; max-width: calc(100% - 32px); }
.frow .ar { font-family: var(--font-ar); font-weight: 700; direction: rtl; line-height: 1.4; text-align: end; min-width: 0; overflow-wrap: anywhere; }
.none { color: var(--muted); font-size: 0.85rem; font-style: italic; padding: 10px 0; }
.note { color: var(--muted); font-size: 0.78rem; padding: 6px 0 0; }

.primary .dlabel, .secondary .dlabel { color: var(--c); }
.primary .ar { font-size: 1.8rem; }
.primary .frow { padding: 14px 0; }
.secondary { margin-top: 18px; }
.secondary .ar { font-size: 1.8rem; }
.secondary .frow { padding: 14px 0; }
.back .hint { margin-top: auto; }

/* Buttons under the card */
.answer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.answer button { padding: 10px; font-size: 0.9rem; border-width: 1.5px; }
.answer .yes[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--surface); }
.answer .no[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.nav button { font: 700 1rem var(--font-ui); padding: 15px 10px; border-radius: 14px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.nav .next { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.nav button:disabled { opacity: .4; cursor: default; }
.answer button, .end button, .sheet .save {
  font: 700 1rem var(--font-ui); padding: 15px 10px; border-radius: 14px; cursor: pointer;
  border: 2px solid currentColor; background: var(--surface);
}
.answer .no { color: var(--bad); }
.answer .yes { color: var(--good); }
.answer button:disabled { opacity: .35; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

.end { background: var(--surface); border-radius: 22px; border: 1px solid var(--line); padding: 28px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
.end .big { font-family: var(--font-display); font-weight: 650; font-size: 3rem; font-variant-numeric: tabular-nums; }
.end p { margin: 0; color: var(--muted); line-height: 1.5; }
.end .row { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.end .primarybtn { color: var(--fg); }
.end .missed { color: var(--bad); }

/* Card type editor */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg); width: 100%; max-width: 460px; max-height: 92%; overflow-y: auto;
  border-radius: 22px 22px 0 0; display: flex; flex-direction: column; gap: 16px;
  padding-top: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.sheet h2 { font-family: var(--font-display); font-weight: 650; font-size: 1.3rem; margin: 0; }
.field { display: flex; flex-direction: column; gap: 8px; border: 0; margin: 0; padding: 0; }
.field > span, .field legend { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 8px; }
.opts { display: grid; gap: 6px; }
.opts label {
  display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border-radius: 12px; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line);
}
.opts label:has(input:checked) { border-color: var(--fg); }
.opts input { margin-top: 3px; accent-color: var(--fg); }
.opts b { display: block; font-weight: 600; }
.opts small { color: var(--muted); font-size: 0.8rem; }
.opts .ex { font-style: italic; }
.dopts { display: grid; gap: 6px; }
.dopt { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); }
.dopt:has(input:checked) { border-color: var(--fg); }
.dopt label { display: flex; gap: 10px; align-items: flex-start; flex: 1; min-width: 0; cursor: pointer; }
.dopt input { margin-top: 3px; accent-color: var(--fg); }
.dopt b { display: block; font-weight: 600; }
.dopt small { color: var(--muted); font-size: 0.8rem; }
.trsel { flex-shrink: 0; max-width: 46%; font: 600 0.85rem var(--font-ui); padding: 7px 8px; border-radius: 10px; }
.dopt:not(:has(input:checked)) .trsel { opacity: .45; }
.dopt:not(:has(input:checked)) #front-d { display: none; }
.trhelp { margin: 4px 0 0; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
.sheet .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .save { color: var(--fg); flex: 1 1 100%; }
.sheet .ghost { flex: 1; }
.sheet .del { color: var(--bad); }
.pv { --c: var(--noun); background: var(--surface); border: 3px solid var(--c); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; }
.pv.verb { --c: var(--verb); } .pv.prep { --c: var(--prep); } .pv.other { --c: var(--other); } .pv.adj { --c: var(--adj); } .pv.pron { --c: var(--pron); } .pv.q { --c: var(--q); }
.pv .chips { display: flex; justify-content: space-between; margin-bottom: 4px; }
.pv .word { margin-bottom: 10px; }
.pv .empty { color: var(--muted); font-size: 0.9rem; }
.pvmeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 0.85rem; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--fg); font: 600 0.85rem var(--font-ui); text-decoration: underline; cursor: pointer; }

.printbox { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
.printbox button { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
.printbox svg { width: 18px; height: 18px; flex-shrink: 0; }
.printbox p { margin: 0; color: var(--muted); font-size: 0.8rem; line-height: 1.5; }

@media (prefers-reduced-motion: reduce) { .card, .progress i { transition: none; } }
</style>

        <div class="dopt"><label><input type="checkbox" name="dialect" id="d-msa" value="msa"><span><b>Standardarabiska</b></span></label><select class="trsel" id="tr-msa" aria-label="Transkription för standardarabiska"><option value="book">ALA-LC</option><option value="din">DIN 31635</option><option value="arabizi">Arabizi</option><option value="none">Ingen</option></select></div>

<script>
// Ordlista från arabiska_ordlista.csv. pos: noun | prep | verb | adj | pron | q (frågeord) | other (fraser och småord). t = tema.
// leb/irq/msa: { f: [[arabiska, translitteration], (plural)], n: anmärkning, s: kapitel }. Utan s = ordet finns inte i boken för den dialekten och är ifyllt i efterhand.
// Libanesisk translitteration är bokens (9 = ʿ, H = ḥ, ʃ = š, x = ḫ, G = ġ, versaler = emfatiska, dubbla vokaler = långa).
const WORDS = __WORDS__;
// Appen ligger i alla/, libanesiska/ och standardarabiska/, en mapp under startsidan och ljud/.
// Dialektsidorna byggs med en låst dialekt.
const LOCK = __LOCK__, BASE = "../";

const POS = { noun: "Substantiv", prep: "Preposition", verb: "Verb", adj: "Adjektiv", pron: "Pronomen", q: "Frågeord", other: "Fras" };
const DIALECT = { leb: "Libanesiska", irq: "Irakiska", msa: "Standardarabiska" };
const ORDER_D = ["leb", "irq", "msa"];
// Kapitel: Standard lektion 1, 2 … först, sedan libanesiska kapitel. En dialektsida visar bara sina egna.
const CHAPTERS = [...new Set(WORDS.flatMap(w => (LOCK ? [LOCK] : ORDER_D).map(k => w[k] && w[k].s).filter(Boolean)))]
  .sort((a, b) => a.localeCompare(b, "sv", { numeric: true }) * (a[0] === b[0] ? 1 : -1));
const typeChapters = t => (t.chapters || []).filter(c => CHAPTERS.includes(c));
const inChapters = (w, cs) => ORDER_D.some(k => w[k] && cs.includes(w[k].s));
// Verb med tre former: dåtid han (grundformen), dåtid jag, nutid jag. Med två former: dåtid han, nutid han.
const verbLabel = (n, k) => (n === 3 ? ["Dåtid (han)", "Dåtid (jag)", "Nutid (jag)"] : ["Dåtid (han)", "Nutid (han)"])[k];
// Äldre korttyper sparade dialekten som "leb", "msa" eller "both".
const dialects = t => { const d = t.dialect; const a = Array.isArray(d) ? d : d === "both" ? ["leb", "msa"] : [d]; return ORDER_D.filter(k => a.includes(k)); };
const dialectName = ds => ds.length === 3 ? "Alla tre dialekterna" : ds.map(k => DIALECT[k]).join(" + ");
const TRANSLIT = { book: "bokens", din: "DIN", arabizi: "Arabizi", none: "utan transkription" };
// Transkription per dialekt. Äldre val sparade en gemensam transkription som text.
const trOf = (t, k) => (typeof t.translit === "string" ? t.translit : (t.translit && t.translit[k])) || "book";
const $ = id => document.getElementById(id);

// --- Transkription ---
function rep(s, pairs) { for (const [a, b] of pairs) s = s.split(a).join(b); return s; }
const LEB_LONG = [["aa", "ā"], ["ii", "ī"], ["uu", "ū"], ["ee", "ē"], ["oo", "ō"]];
function translit(s, dialect, sys) {
  if (dialect === "irq" && sys === "din") s = rep(s, [["DH", "ḏ̣"], ["dh", "ḏ"], ["th", "ṯ"]]);
  if (dialect === "irq" && sys === "arabizi") s = rep(s, [["DH", "dh"], ["č", "ch"]]);
  if (dialect === "irq") dialect = "leb";
  if (sys === "din") {
    return dialect === "leb"
      ? rep(rep(s, LEB_LONG), [["ʃ", "š"], ["x", "ḫ"], ["9", "ʿ"], ["H", "ḥ"], ["S", "ṣ"], ["T", "ṭ"], ["D", "ḍ"], ["Z", "ẓ"], ["G", "ġ"], ["j", "ǧ"], ["'", "ʾ"]])
      : rep(s, [["sh", "š"], ["kh", "ḫ"], ["dh", "ḏ"], ["th", "ṯ"], ["gh", "ġ"], ["j", "ǧ"], ["'", "ʾ"]]);
  }
  if (sys === "arabizi") {
    return dialect === "leb"
      ? rep(s, [["aa", "a"], ["ii", "i"], ["uu", "ou"], ["ee", "e"], ["oo", "o"], ["ʃ", "sh"], ["x", "kh"], ["9", "3"], ["H", "7"], ["S", "s"], ["T", "t"], ["D", "d"], ["Z", "z"], ["G", "gh"], ["'", "2"]])
      : rep(s, [["ʿ", "3"], ["ḥ", "7"], ["'", "2"], ["ṣ", "s"], ["ḍ", "d"], ["ṭ", "t"], ["ẓ", "z"], ["ā", "a"], ["ī", "i"], ["ū", "ou"]]);
  }
  return s;
}

// --- Val av kort: dialekter, kapitel och transkription. Senaste valet minns i den här webbläsaren. ---
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
let cur = LOCK ? { dialect: [LOCK], translit: {}, chapters: [], trv: 2 } : load("arabiska-val", null);
if (!cur) {
  // Börja från den korttyp som var vald i den tidigare versionen, om det finns en.
  const old = load("arabiska-korttyper", null), id = load("arabiska-aktiv-korttyp", null);
  const t = Array.isArray(old) && (old.find(x => x.id === id) || old[0]);
  cur = t ? { dialect: dialects(t), translit: t.translit, chapters: t.chapters || [] } : { dialect: ["leb", "msa"], translit: {}, chapters: [] };
}
// En tidigare version saknade "Bokens" och sparade DIN i stället. Återställ till bokens en gång.
// Kapitel valdes tidigare i Skapa nya kort. Nu görs det bara i filtret, så ett gammalt val tas bort.
cur.chapters = [];
// På en dialektsida minns sidan själv vilket språk framsidan har, så valet på Alla inte skrivs över.
if (LOCK) cur.front = load("arabiska-fram-" + LOCK, "sv");
if (!cur.trv) { for (const k in (cur.translit || {})) if (cur.translit[k] === "din") cur.translit[k] = "book"; cur.trv = 2; save("arabiska-val", cur); }
const active = () => cur;
// Arabiska på framsidan: första valda dialekt som har ordet.
const frontAr = t => t.front === "ar";
const frontDialect = (w, t) => w[t.frontD] && dialects(t).includes(t.frontD) ? t.frontD : dialects(t).find(k => w[k]);
const summary = t => { const cs = typeChapters(t); return `${dialects(t).map(k => `${DIALECT[k]} (${trOf(t, k) === "book" ? { leb: "Spoken Lebanese", irq: "Spoken Lebanese", msa: "ALA-LC" }[k] : TRANSLIT[trOf(t, k)]})`).join(" + ")}${cs.length ? " · " + cs.join(", ") : ""}`; };

function renderTypes() {
  const t = active(), cs = typeChapters(t);
  // Kapitelmenyn visar bara kapitel som är valda.
  const avail = cs.length ? cs : CHAPTERS;
  chapters = chapters.filter(c => avail.includes(c));
  $("chapter-list").innerHTML = avail.map(c => `<label><input type="checkbox" value="${esc(c)}"${chapters.includes(c) ? " checked" : ""}>${esc(c)}</label>`).join("")
    + `<button type="button" class="clear">Alla kapitel</button>`;
  chapterLabel();
}
// Knappen visar valda kapitel kort: "Standard 1, 2" eller "Alla kapitel".
const shortChapter = c => c.replace(" lektion", "").replace(" kap.", " kap");
function chapterLabel() {
  const names = chapters.map(shortChapter);
  const same = names.length > 1 && names.every(n => n.replace(/\d+$/, "") === names[0].replace(/\d+$/, ""));
  const text = !names.length ? "Alla kapitel" : same ? names[0] + ", " + names.slice(1).map(n => n.match(/\d+$/)[0]).join(", ") : names.join(", ");
  $("chapter").innerHTML = `<span>${esc(text)}</span>`;
}

function sheetChoice() {
  const ar = (document.querySelector('input[name="front"]:checked') || {}).value === "ar";
  const checkedD = [...document.querySelectorAll('input[name="dialect"]:checked')].map(x => x.value);
  return {
    // Med arabiska på framsidan gäller bara dialekten som valts där.
    dialect: ar ? [$("front-d").value] : checkedD,
    svDialect: checkedD,
    translit: Object.fromEntries(ORDER_D.map(k => [k, $("tr-" + k).value])),
    // Kapitel väljs i filtret ovanför korten, inte här.
    chapters: [],
    front: (document.querySelector('input[name="front"]:checked') || {}).value || "sv",
    frontD: $("front-d").value,
    trv: 2,
  };
}
let pvWord = null;
function renderPreview(newWord) {
  const t = sheetChoice();
  $("dfield").hidden = t.front === "ar";
  const words = t.dialect.length ? poolFor(t) : [];
  $("create").disabled = !words.length;
  $("pvcount").textContent = !t.dialect.length ? "Välj minst en dialekt." : `${words.length} kort`;
  $("pvnext").hidden = words.length < 2;
  if (!words.length) { $("preview").className = "pv"; $("preview").innerHTML = `<div class="empty">${t.dialect.length ? "Inga ord matchar valet." : "Välj minst en dialekt för att se ett kort."}</div>`; return; }
  if (newWord || !words.includes(pvWord)) {
    const others = words.filter(w => w !== pvWord);
    // Visa gärna ett verb första gången, det visar flest former.
    const verbs = !pvWord && others.filter(w => w.pos === "verb" && w[t.dialect[0]] && w[t.dialect[0]].f.length === 3);
    const from = verbs && verbs.length ? verbs : others;
    pvWord = from[Math.floor(Math.random() * from.length)];
  }
  const w = pvWord, ds = dialects(t);
  $("preview").className = "pv " + w.pos;
  const fk = frontAr(t) && frontDialect(w, t);
  const pvf = fk ? `<div class="pvfront"><span class="side">Framsida</span><span class="ar" lang="ar">${w[fk].f.map(f => esc(f[0])).join("<br>")}</span></div>` : "";
  $("preview").innerHTML = pvf + `<div class="chips"><span class="pos">${POS[w.pos]}</span><span class="side">Baksida</span></div><div class="word">${esc(w.sv)}</div>`
    + ds.map((k, n) => block(w, k, n ? "secondary" : "primary", trOf(t, k))).join("");
}
function openSheet() {
  const t = active(), ds = dialects(t);
  for (const k of ORDER_D) $("d-" + k).checked = (t.svDialect || ds).includes(k);
  for (const k of ORDER_D) $("tr-" + k).value = trOf(t, k);
  document.querySelectorAll('input[name="front"]').forEach(x => x.checked = x.value === (t.front || "sv"));
  $("front-d").value = t.frontD || ds[0] || "leb";
  pvWord = null; renderPreview();
  $("scrim").hidden = false;
  // Börja högst upp i formuläret.
  $("sheet").scrollTop = 0;
  $("create").focus({ preventScroll: true });
}
function closeSheet() { $("scrim").hidden = true; }
$("sheet").addEventListener("change", e => {
  if (e.target.id === "front-d") document.querySelector('input[name="front"][value="ar"]').checked = true;
  renderPreview();
});
$("preview").addEventListener("click", e => { const b = e.target.closest(".say"); if (b) speak(b); });
$("pvnext").addEventListener("click", () => renderPreview(true));
$("sheet").addEventListener("submit", e => {
  e.preventDefault();
  const t = sheetChoice();
  if (!t.dialect.length) return;
  cur = t; save("arabiska-val", cur);
  closeSheet(); renderTypes(); frontLabel(); start(pool());
});
$("cancel").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("scrim").hidden) closeSheet(); });
$("new-type").addEventListener("click", openSheet);

// Knappen bredvid Filter byter framsidan mellan svenska och arabiska utan att blanda om korten.
function frontLabel() {
  const ar = frontAr(cur);
  $("front-name").textContent = ar ? "Arabiska" : "Svenska";
  $("front-btn").setAttribute("aria-label", `Framsida: ${ar ? "arabiska" : "svenska"}. Byt till ${ar ? "svenska" : "arabiska"}`);
}
$("front-btn").addEventListener("click", () => {
  const before = dialects(cur).join();
  cur.front = frontAr(cur) ? "sv" : "ar";
  // Med arabiska framsida i Skapa nya kort valdes bara en dialekt. Tillbaka på svenska gäller de dialekter som var ikryssade.
  if (cur.front === "sv" && cur.svDialect && cur.svDialect.length) cur.dialect = cur.svDialect;
  if (LOCK) save("arabiska-fram-" + LOCK, cur.front); else save("arabiska-val", cur);
  frontLabel();
  if (dialects(cur).join() !== before || $("play").hidden) start(pool()); else show();
});
frontLabel();

// Länkar mellan sidorna. En dialektsida visar alla ord i sin dialekt och har inga egna val.
const PAGES = [["libanesiska/", "Libanesiska", "leb", ["lb"]], ["standardarabiska/", "Standardarabiska", "msa", ["al"]], ["alla/", "Alla", null, ["lb", "iq", "al"]]];
const FLAG = { lb: "Libanons flagga", iq: "Iraks flagga", al: "Arabförbundets flagga" };
const flags = fs => fs.map(f => `<svg role="img" aria-label="${FLAG[f]}"><use href="#flag-${f}"/></svg>`).join("");
// Öppnad direkt från disken visar webbläsaren inte index.html i en mapp av sig själv.
const page = p => BASE + p + (location.protocol === "file:" ? "index.html" : "");
$("title").href = page("");
$("pages").innerHTML = PAGES.map(([p, name, k, fs]) => `<a href="${page(p)}"${k === LOCK ? ' aria-current="page"' : ""}>${fs.length > 1 ? `<span class="many">${flags(fs)}</span>` : flags(fs)}${name}</a>`).join("");
// Rubriken får samma flagga som sidan har i länkarna längst ner.
{ const fs = PAGES.find(x => x[2] === LOCK)[3];
  $("title").innerHTML = `<span class="tflags${fs.length > 1 ? " many" : ""}">${flags(fs)}</span>${LOCK ? DIALECT[LOCK] : "Arabiska"}`; }
if (LOCK) {
  document.title = DIALECT[LOCK] + " ordkort";
  $("new-type").closest(".typerow").hidden = true;
}

// --- Övning ---
let filter = "all", themes = [], chapters = [], query = "", deck = [], i = 0;

function shuffle(a) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
// Orden som valet av dialekter och kapitel ger, utan filtren ovanför korten.
// En dialektsida tar bara ord från boken för den dialekten (de som har ett kapitel).
function poolFor(t) {
  const ds = dialects(t), cs = typeChapters(t);
  return WORDS.filter(w => (LOCK ? w[LOCK] && w[LOCK].s : ds.some(k => w[k])) && (!cs.length || inChapters(w, cs)));
}
// Sökningen bortser från vokaltecken, accenter och stora bokstäver, så "kitab" hittar kitāb och "كتاب" hittar كِتاب.
const fold = t => String(t).normalize("NFD").replace(/[\u0300-\u036f\u064b-\u0652\u0670ʿʾ'’9]/g, "").replace(/[أإآ]/g, "ا").toLowerCase();
function matches(w, q) {
  if (fold(w.sv).includes(q)) return true;
  return ORDER_D.some(k => w[k] && w[k].f.some(([ar, tr]) => fold(ar).includes(q) || fold(tr).includes(q)));
}
function pool() {
  const q = fold(query.trim());
  return poolFor(active()).filter(w => (filter === "all" || w.pos === filter) && (!themes.length || themes.includes(w.t)) && (!chapters.length || inChapters(w, chapters)) && (!q || matches(w, q)));
}

// Siffran på Filter-knappen: hur många av ordklass, kapitel och tema som är valda.
function filterBadge() {
  const n = (filter !== "all") + (chapters.length > 0) + (themes.length > 0);
  $("filter-n").hidden = !n; $("filter-n").textContent = n;
}
function start(words) {
  filterBadge();
  updatePrintInfo();
  if (!words.length) {
    $("play").hidden = true; $("end").hidden = false; $("endscore").textContent = "0 kort";
    $("endtext").textContent = "Inga ord matchar det här valet. Ändra sökningen eller välj en annan ordklass, ett annat tema eller ett annat kapitel.";
    $("count").textContent = "Kort 0 av 0"; $("bar").style.width = "0";
    return;
  }
  deck = shuffle(words); i = 0;
  $("play").hidden = false; $("end").hidden = true;
  show();
}

// ʿ (ayn) visas som ett upphöjt c och ʾ (hamza) som ett spegelvänt upphöjt c, så att de syns.
const trHtml = t => esc(t).replace(/[ʿʾ]/g, m => m === "ʿ" ? `<span class="ayn" title="ayn">c</span>` : `<span class="ayn hz" title="hamza">c</span>`);
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function block(w, key, role, sys = trOf(active(), key)) {
  const d = w[key];
  const label = `<div class="dlabel"><span>${DIALECT[key]}</span>${d && d.s ? `<em>${esc(d.s)}</em>` : ""}</div>`;
  if (!d) return `<div class="dialect ${role}">${label}<div class="none">Finns inte i ditt material än</div></div>`;
  const two = d.f.length > 1;
  const rows = d.f.map(([ar, tr], k) => {
    const t = sys !== "none" && tr ? `<span class="tr">${trHtml(translit(tr, key, sys))}</span>` : "";
    const lab = two ? `<span class="k">${w.pos === "verb" ? verbLabel(d.f.length, k) : (k ? "Plural" : "Singular")}</span>` : "";
    return `<div class="frow"><div class="l">${lab}${t}</div><div class="r"><span class="ar" lang="ar">${esc(ar)}</span><button type="button" class="say" data-say="${esc(ar)}" data-dialect="${key}" aria-label="Lyssna">${SPEAKER}</button></div></div>`;
  }).join("") + (d.n ? `<div class="note">${esc(d.n)}</div>` : "");
  return `<div class="dialect ${role}">${label}${rows}</div>`;
}

function show() {
  const w = deck[i], card = $("card"), ds = dialects(active());
  card.classList.remove("flipped");
  for (const p of ["verb", "prep", "adj", "pron", "q", "other"]) card.classList.toggle(p, w.pos === p);
  $("pos-f").textContent = $("pos-b").textContent = POS[w.pos];
  $("sv").textContent = $("sv-b").textContent = w.sv;
  $("svsub").textContent = w.t;
  const fk = frontAr(active()) && frontDialect(w, active());
  $("svf").hidden = !!fk; $("arf").hidden = !fk;
  if (fk) {
    const fs = w[fk].f, small = fs.length > 1;
    $("arf").innerHTML = fs.map(([ar]) => `<div class="fr"><span class="ar${small ? " small" : ""}" lang="ar">${esc(ar)}</span><button type="button" class="say" data-say="${esc(ar)}" data-dialect="${fk}" aria-label="Lyssna">${SPEAKER}</button></div>`).join("") + `<small>${DIALECT[fk]}</small>`;
  }
  setTimeout(() => {
    $("blocks").innerHTML = ds.map((k, n) => block(w, k, n ? "secondary" : "primary")).join("");
  }, card.dataset.ready ? 200 : 0);
  card.dataset.ready = 1;
  $("prev").disabled = i === 0;
  $("next").textContent = i === deck.length - 1 ? "Klar" : "Nästa";
  $("count").textContent = `Kort ${i + 1} av ${deck.length}`;
  $("bar").style.width = (i / deck.length * 100) + "%";
}

function step(dir) {
  i += dir;
  if (i >= deck.length) { i = deck.length - 1; finish(); return; }
  show();
}

function finish() {
  $("play").hidden = true; $("end").hidden = false;
  $("bar").style.width = "100%";
  $("endscore").textContent = `${deck.length} kort`;
  $("endtext").textContent = "Du har gått igenom alla kort. Tryck på Börja om för att blanda och köra igen.";
}

function flip() { $("card").classList.toggle("flipped"); }
$("card").addEventListener("click", e => {
  const b = e.target.closest(".say");
  if (b) { e.stopPropagation(); speak(b); return; }
  flip();
});
$("card").addEventListener("keydown", e => {
  if (e.target !== $("card")) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
});

// --- Uttal med enhetens talsyntes ---
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices().filter(v => /^ar/i.test(v.lang)); } catch {} }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
// --- Utskrift: bygger en fristående sida med de kort som är valda just nu ---
const PRINT_CSS = `@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; }
body { font-family: Figtree, system-ui, sans-serif; color: #17202B; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.help { font-size: 14px; padding: 16px; max-width: 640px; line-height: 1.5; }
@media print { .help { display: none; } }
.sheet { width: 210mm; height: 297mm; display: grid; grid-template-columns: repeat(3, 63mm); grid-auto-rows: 88mm; justify-content: center; align-content: center; page-break-after: always; break-after: page; }
.cell { position: relative; outline: 0.2mm dashed #C9CFD8; outline-offset: -0.1mm; padding: 2.5mm; }
.card { --c: #1F5FD1; height: 100%; border: 1.6mm solid var(--c); border-radius: 4mm; padding: 3mm 3.2mm; overflow: hidden; }
.in { height: 100%; display: flex; flex-direction: column; }
.verb { --c: #D9650B; } .prep { --c: #B02A78; } .other { --c: #5E6B7D; } .adj { --c: #2E7D3E; } .pron { --c: #6A4BC4; } .q { --c: #946A00; }
.top { display: flex; justify-content: space-between; font-size: 2.5mm; }
.pos { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.side { color: #5B6676; }
.sv { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 7mm; line-height: 1.15; overflow-wrap: anywhere; }
.sv.arfront { flex-direction: column; gap: 1mm; }
.sv.arfront .ar { font-size: 8mm; white-space: normal; }
.sub { text-align: center; color: #5B6676; font-size: 2.8mm; line-height: 1.4; }
.word { font-weight: 800; font-size: 3.6mm; margin: 1.2mm 0 1.6mm; }
.dl { display: flex; justify-content: space-between; font-size: 2.1mm; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--c); border-bottom: 0.25mm solid #D6DCE4; padding-bottom: .6mm; }
.dl em { font-style: normal; font-weight: 400; letter-spacing: 0; text-transform: none; }
.d + .d { margin-top: 2mm; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 1.5mm; padding: .9mm 0; border-bottom: 0.2mm solid #E6EAF0; }
.row:last-child { border-bottom: 0; }
.l { display: flex; flex-direction: column; min-width: 21mm; flex-shrink: 1; }
.k { font-weight: 700; font-size: 2.5mm; }
.tr { font-style: italic; color: #5B6676; font-size: 2.8mm; overflow-wrap: anywhere; }
.ar { flex-shrink: 0; font-family: "Noto Naskh Arabic", serif; font-weight: 700; direction: rtl; white-space: nowrap; line-height: 1.35; font-size: 5.4mm; }
.vg { display: grid; grid-template-columns: 10mm 1fr 1fr; column-gap: 1.5mm; align-items: center; }
.vh { font-weight: 700; font-size: 2.3mm; color: #5B6676; text-align: center; padding-top: .6mm; }
.vk { font-weight: 700; font-size: 2.5mm; }
.vc { min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: .6mm 0; border-bottom: 0.2mm solid #E6EAF0; }
.vg .vc:last-child, .vg .vc:nth-last-child(2) { border-bottom: 0; }
.vc .ar { font-size: 4.8mm; }
.vc .tr { font-size: 2.5mm; }
.ayn { font-style: normal; font-weight: 500; font-size: 0.8em; line-height: 0; vertical-align: 0.4em; display: inline-block; margin: 0 0.06em; }
.ayn.hz { transform: scaleX(-1); }
.note { font-size: 2.1mm; color: #5B6676; padding-top: .6mm; }`;

// Krymper arabisk text som inte får plats, och sedan hela kortet om det fortfarande är för högt. Körs i utskriftsfilen.
function fitCards() {
  document.fonts.ready.then(() => {
    for (const el of document.querySelectorAll(".ar, .sv")) {
      let s = parseFloat(getComputedStyle(el).fontSize), box = el.closest(".row, .vc") || el.parentElement;
      while (s > 6 && (box.scrollWidth > box.clientWidth + 1 || el.scrollHeight > el.clientHeight + 2 && el.classList.contains("sv"))) { s *= 0.93; el.style.fontSize = s + "px"; }
    }
    for (const c of document.querySelectorAll(".card")) {
      const inner = c.firstElementChild;
      let g = 0; while (c.scrollHeight > c.clientHeight + 1 && g++ < 12) inner.style.zoom = (parseFloat(inner.style.zoom) || 1) * 0.94;
    }
    setTimeout(() => window.print(), 300);
  });
}

function printDoc(words, t) {
  const ds = dialects(t);
  const order = { noun: 0, verb: 1, adj: 2, prep: 3, pron: 4, q: 5, other: 6 };
  const cards = words.slice().sort((a, b) => order[a.pos] - order[b.pos] || a.t.localeCompare(b.t, "sv") || a.sv.localeCompare(b.sv, "sv"));
  const trs = (tr, key) => trOf(t, key) !== "none" && tr ? `<span class="tr">${trHtml(translit(tr, key, trOf(t, key)))}</span>` : "";
  const blk = (w, key) => {
    const d = w[key]; if (!d) return "";
    const rows = d.f.map(([ar, tr], k) => `<div class="row"><div class="l">${d.f.length > 1 ? `<span class="k">${w.pos === "verb" ? verbLabel(d.f.length, k) : (k ? "Plural" : "Singular")}</span>` : ""}${trs(tr, key)}</div><span class="ar">${esc(ar)}</span></div>`).join("");
    return `<div class="d"><div class="dl"><span>${DIALECT[key]}</span>${d.s ? `<em>${esc(d.s)}</em>` : ""}</div>${rows}${d.n ? `<div class="note">${esc(d.n)}</div>` : ""}</div>`;
  };
  const front = w => {
    const fk = frontAr(t) && frontDialect(w, t);
    const mid = fk ? `<div class="sv arfront">${w[fk].f.map(f => `<span class="ar">${esc(f[0])}</span>`).join("")}</div><div class="sub">${DIALECT[fk]}</div>` : `<div class="sv">${esc(w.sv)}</div><div class="sub">${esc(w.t)}</div>`;
    return `<div class="card ${w.pos}"><div class="in"><div class="top"><span class="pos">${POS[w.pos]}</span><span class="side">Framsida</span></div>${mid}</div></div>`;
  };
  const back = w => `<div class="card ${w.pos}"><div class="in"><div class="top"><span class="pos">${POS[w.pos]}</span><span class="side">Baksida</span></div><div class="word">${esc(w.sv)}</div>${ds.map(k => blk(w, k)).join("")}</div></div>`;
  let body = "";
  for (let p = 0; p < cards.length; p += 9) {
    const page = cards.slice(p, p + 9);
    body += `<div class="sheet">${page.map(w => `<div class="cell">${front(w)}</div>`).join("")}</div>`;
    // Baksidorna spegelvänds per rad så att de hamnar rätt vid dubbelsidig utskrift (vänd på långsidan).
    const cells = [];
    for (let r = 0; r < 3; r++) for (let c = 2; c >= 0; c--) { const w = page[r * 3 + c]; cells.push(w ? `<div class="cell">${back(w)}</div>` : `<div class="cell" style="outline:0"></div>`); }
    body += `<div class="sheet">${cells.join("")}</div>`;
  }
  return `<!doctype html><html lang="sv"><head><meta charset="utf-8"><title>Ordkort</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&family=Noto+Naskh+Arabic:wght@700&display=swap">
<style>${PRINT_CSS}</style></head><body>
<p class="help">${cards.length} kort · ${esc(summary(t))}. Skriv ut på A4 i 100 % skala, dubbelsidigt och vänd på långsidan. Klipp längs de streckade linjerna.</p>
${body}<script>(${fitCards.toString()})();<\/script></body></html>`;
}

function updatePrintInfo() {
  const n = pool().length, t = active();
  $("print").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg><span>Skriv ut ${n} kort</span>`;
  $("print").disabled = !n;
}
$("print").addEventListener("click", async () => {
  const t = active(), html = printDoc(pool(), t);
  const name = `ordkort-${dialects(t).join("-")}${typeChapters(t).length ? "-" + typeChapters(t).map(c => c.replace(/\D/g, "")).join("") : ""}.html`;
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: name, data: html }); toast("Öppna filen så startar utskriften."); }
    catch (e) { if (e.code !== "declined") toast("Det gick inte att spara utskriftsfilen här."); }
    return;
  }
  const win = window.open(URL.createObjectURL(new Blob([html], { type: "text/html" })), "_blank");
  if (!win) toast("Utskriften kunde inte öppnas här. Öppna appen i claude.ai och försök igen.");
});

function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.append(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 3500);
}
// Inspelade ljudfiler (skapas med skapa_ljud.py) ligger i mappen ljud/ bredvid sidan. Finns de inte används enhetens röst.
let audioMap = {}, audio = null;
// ljud/index.js fungerar även när sidan öppnas direkt från disken, där Chrome stoppar fetch.
const ljudJs = document.createElement("script");
ljudJs.src = BASE + "ljud/index.js";
ljudJs.onload = () => { if (window.LJUD) audioMap = window.LJUD; };
ljudJs.onerror = () => fetch(BASE + "ljud/index.json").then(r => r.ok ? r.json() : {}).then(m => { audioMap = m || {}; }).catch(() => {});
document.head.append(ljudJs);
function speak(btn) {
  const file = audioMap[btn.dataset.dialect + "|" + btn.dataset.say];
  if (file) {
    if (audio) audio.pause();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    document.querySelectorAll(".say.playing").forEach(x => x.classList.remove("playing"));
    audio = new Audio(BASE + "ljud/" + file);
    btn.classList.add("playing");
    audio.onended = audio.onerror = () => btn.classList.remove("playing");
    audio.play().catch(() => btn.classList.remove("playing"));
    return;
  }
  if (!("speechSynthesis" in window)) { toast("Din webbläsare kan inte läsa upp text."); return; }
  loadVoices();
  // Libanesisk röst om enheten har en, annars en levantinsk eller valfri arabisk röst.
  const pref = { leb: ["ar-LB", "ar-SY", "ar-JO", "ar-PS"], irq: ["ar-IQ", "ar-KW", "ar-SA", "ar-001"] }[btn.dataset.dialect] || ["ar-SA", "ar-001", "ar-EG"];
  const voice = pref.map(l => voices.find(v => v.lang.replace("_", "-").toLowerCase() === l.toLowerCase())).find(Boolean) || voices[0];
  if (!voice) { toast("Din enhet har ingen arabisk röst. Lägg till en arabisk röst i enhetens talinställningar, eller använd Edge."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(btn.dataset.say.replace(/\s*\/\s*/g, "، "));
  u.voice = voice; u.lang = voice.lang; u.rate = 0.8;
  document.querySelectorAll(".say.playing").forEach(x => x.classList.remove("playing"));
  btn.classList.add("playing");
  u.onend = u.onerror = () => btn.classList.remove("playing");
  speechSynthesis.speak(u);
}
$("restart").addEventListener("click", () => start(pool()));
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  start(pool());
}));
// Teman väljs som kapitlen: flera kan kryssas i.
$("theme-list").innerHTML = [...new Set(poolFor(active()).map(w => w.t))].sort((a, b) => a.localeCompare(b, "sv"))
  .map(t => `<label><input type="checkbox" value="${esc(t)}">${esc(t)}</label>`).join("") + `<button type="button" class="clear">Alla teman</button>`;
const themeLabel = () => $("theme").innerHTML = `<span>${esc(themes.length ? themes.join(", ") : "Alla teman")}</span>`;
themeLabel();
$("filter-btn").addEventListener("click", () => {
  const open = $("filterpanel").hidden;
  $("filterpanel").hidden = !open; $("filter-btn").setAttribute("aria-expanded", open);
});
$("filter-clear").addEventListener("click", () => {
  filter = "all"; themes = []; chapters = [];
  $("theme-list").querySelectorAll("input").forEach(x => x.checked = false); themeLabel();
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === "all"));
  renderTypes(); start(pool());
});
// Menyerna för kapitel och tema. Bara en är öppen åt gången.
function menu(id, open) {
  $(id + "-list").hidden = !open;
  $(id).setAttribute("aria-expanded", open);
}
const MENUS = { chapter: [v => chapters = v, chapterLabel], theme: [v => themes = v, themeLabel] };
for (const [id, [set, label]] of Object.entries(MENUS)) {
  $(id).addEventListener("click", () => { const open = $(id + "-list").hidden; for (const m in MENUS) menu(m, false); menu(id, open); });
  $(id + "-list").addEventListener("change", () => {
    set([...$(id + "-list").querySelectorAll("input:checked")].map(x => x.value));
    label(); start(pool());
  });
  $(id + "-list").addEventListener("click", e => {
    if (!e.target.closest(".clear")) return;
    $(id + "-list").querySelectorAll("input").forEach(x => x.checked = false);
    set([]); label(); menu(id, false); start(pool());
  });
}
// Menyn stängs vid klick utanför eller Escape.
document.addEventListener("click", e => { if (!e.target.closest(".multi")) for (const m in MENUS) menu(m, false); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  for (const m in MENUS) if (!$(m + "-list").hidden) { menu(m, false); $(m).focus(); }
});
$("q").addEventListener("input", e => { query = e.target.value; start(pool()); });

renderTypes();
start(pool());
</script>
